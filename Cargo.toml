[workspace]
resolver = "3"
members = ["crates/kite-core", "crates/kite-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
encoding_rs = "0.8"
chardetng = "0.1"
winit = "0.30.13"
wgpu = "30.0.1"
glyphon = "0.12.0"
cosmic-text = "0.19.0"
pollster = "0.4"
bytemuck = "1"
arboard = "3"
trash = "5"
unicode-segmentation = "1"
unicode-width = "0.2"
toml = "0.9"
winreg = "0.55"
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
